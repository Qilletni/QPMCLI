# Single source of truth for this repository's own version, and for the
# pinned versions of the Qilletni components it consumes. See
# .qilletni/release.yml and RELEASE.md for the release process, and
# tools/release/README.md (in Qilletni/Qilletni) for the dependency-update
# contract that keeps the two properties below in sync automatically.
qpmVersion=1.0.1-SNAPSHOT

# Pinned by the automated qilletni-core dependency update. dev.qilletni.impl:qilletni
# (core) and dev.qilletni.api:qilletni-api are always released together at this same
# version, as a single release unit - QPM only ever adds qilletni-api as an actual
# build dependency (never core), but the two coordinates share one pinned version
# number, so a single property correctly tracks both.
qilletniCoreVersion=1.0.0

# Pinned by the automated qilletni-pkgutil dependency update.
qilletniPkgutilVersion=1.0.0
