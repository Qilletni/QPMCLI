name: Publish Release

# Local caller workflow for QPM.
#
# Preparing a release is done via the "Release - Prepare" workflow
# (release-prepare.yml), which opens a `release/qpm-X.Y.Z` PR carrying a
# `release/pending-release.json` marker. Merging that PR to `master` does NOT
# require a maintainer to push a tag: the `tag-release` job below detects the
# marker, validates its provenance, and idempotently creates the immutable
# `vX.Y.Z` tag at the merge commit itself, which then triggers
# `build-and-publish`. A direct `vX.Y.Z` tag push remains supported only as a
# manual recovery path if that automation ever fails.
#
# Snapshot publishing (push to `master` while the version is still
# `-SNAPSHOT`) is kept in its own, unprotected job (no `production-release`
# environment) so it stays isolated from a stable release and is never
# mistaken for one.

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - master

permissions:
  contents: read

jobs:
  # Runs only on a push to `master`. Distinguishes an ordinary/snapshot
  # commit from a just-merged release-preparation PR, and - only for the
  # latter - idempotently creates the immutable release tag.
  tag-release:
    runs-on: ubuntu-latest
    if: github.repository == 'Qilletni/QPMCLI' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Otherwise checkout's persisted GITHUB_TOKEN extraheader outranks the
          # App token in the tag push URL below, and the tag triggers nothing.
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: Qilletni/Qilletni
          path: .qilletni-release-tooling
          sparse-checkout: tools/release
          submodules: true  # tools/release submodule (Qilletni/ReleaseTooling)

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: .qilletni-release-tooling/tools/release/package-lock.json

      - name: Install release tooling dependencies
        working-directory: .qilletni-release-tooling/tools/release
        run: npm ci

      - name: Detect whether this commit is a release-preparation merge
        id: detect
        working-directory: .qilletni-release-tooling/tools/release
        run: |
          ROOT_VERSION=$(node --import tsx src/cli.ts get-property --file "$GITHUB_WORKSPACE/gradle.properties" --key qpmVersion)
          echo "Version on master: $ROOT_VERSION"

          if [[ "$ROOT_VERSION" =~ -SNAPSHOT$ ]]; then
            if [[ -f "$GITHUB_WORKSPACE/release/pending-release.json" ]]; then
              echo "::error::Unexpected release/pending-release.json marker present alongside a SNAPSHOT version ($ROOT_VERSION); refusing to auto-tag."
              exit 1
            fi
            echo "Ordinary snapshot commit; nothing to tag here."
            echo "is_release_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! -f "$GITHUB_WORKSPACE/release/pending-release.json" ]]; then
            echo "::error::Version '$ROOT_VERSION' is not a SNAPSHOT and no release/pending-release.json marker was found. A stable version may only reach master through the release-preparation PR."
            exit 1
          fi

          # Until the snapshot follow-up PR merges, master still carries the stable
          # version and marker, so ordinary commits look like the release merge; an
          # existing tag at an earlier commit is what tells them apart.
          EXISTING_SHA=$(git -C "$GITHUB_WORKSPACE" rev-parse --verify --quiet "refs/tags/v$ROOT_VERSION^{commit}" || true)
          if [[ -n "$EXISTING_SHA" && "$EXISTING_SHA" != "$GITHUB_SHA" ]]; then
            echo "Tag 'v$ROOT_VERSION' already exists at $EXISTING_SHA; this is an ordinary commit landing before the snapshot follow-up PR was merged, not a release merge."
            echo "is_release_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "is_release_merge=true"
            echo "version=$ROOT_VERSION"
            echo "tag=v$ROOT_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Validate the release marker
        if: steps.detect.outputs.is_release_merge == 'true'
        working-directory: .qilletni-release-tooling/tools/release
        run: |
          node --import tsx src/cli.ts check-release-marker \
            --marker "$GITHUB_WORKSPACE/release/pending-release.json" \
            --expected-component qpm \
            --expected-version "${{ steps.detect.outputs.version }}"

      - name: Validate this commit came from a genuine, merged release PR
        if: steps.detect.outputs.is_release_merge == 'true'
        working-directory: .qilletni-release-tooling/tools/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            | node --import tsx src/cli.ts check-merge-provenance \
                --component qpm \
                --version "${{ steps.detect.outputs.version }}"

      # A ref pushed with GITHUB_TOKEN never starts a workflow run, so the tag
      # would never reach `build-and-publish`. Push it as the App instead.
      - name: Mint a repository-scoped GitHub App token for the tag push
        id: app-token
        if: steps.detect.outputs.is_release_merge == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.QILLETNI_RELEASE_APP_ID }}
          private-key: ${{ secrets.QILLETNI_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Idempotently create the immutable release tag
        if: steps.detect.outputs.is_release_merge == 'true'
        env:
          TAG_PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TAG="${{ steps.detect.outputs.tag }}"
          EXISTING_SHA=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" || true)

          if [[ -n "$EXISTING_SHA" ]]; then
            if [[ "$EXISTING_SHA" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag '$TAG' already exists at a different commit ($EXISTING_SHA); refusing to move an immutable release tag."
              exit 1
            fi
            echo "Tag '$TAG' already exists at this commit; nothing to do (idempotent)."
          else
            git tag "$TAG" "$GITHUB_SHA"
            # Authenticated as the App - see `persist-credentials` on the checkout.
            git push "https://x-access-token:${TAG_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG"
          fi

  # Runs only on a push to `master` while the version is still a SNAPSHOT.
  # Isolated from build-and-publish: its own job, no production-release
  # environment, so it never shares that protected publication path.
  publish-snapshot:
    runs-on: ubuntu-latest
    needs: tag-release
    if: github.repository == 'Qilletni/QPMCLI' && needs.tag-release.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v5

      - name: Warm the Gradle wrapper
        run: ./gradlew --version

      - name: Check this is a SNAPSHOT version
        id: check
        run: |
          VERSION=$(./gradlew printVersion -q -PincludeSiblingBuilds=false | tail -n1 | tr -d '\r')
          
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?$ ]]; then
            echo "::error::Unexpected version output from Gradle: '$VERSION'"
            exit 1
          fi

          if [[ ! "$VERSION" =~ -SNAPSHOT$ ]]; then
            echo "Not a SNAPSHOT version ($VERSION); this push was a release merge, handled by build-and-publish instead."
            echo "is_snapshot=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "is_snapshot=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build the release archive
        if: steps.check.outputs.is_snapshot == 'true'
        run: ./gradlew releaseArchive -PincludeSiblingBuilds=false

      - name: Extract release notes
        if: steps.check.outputs.is_snapshot == 'true'
        uses: ffurrer2/extract-release-notes@v2
        with:
          changelog_file: CHANGELOG.md
          release_notes_file: RELEASE_NOTES.md
          prerelease: true

      - name: Update snapshot tag
        if: steps.check.outputs.is_snapshot == 'true'
        run: |
          git tag -f snapshot
          git push origin --force refs/tags/snapshot

      # Snapshot version bumps leave stale artifacts with old version names,
      # so this removes them before updating.
      - name: Prune superseded snapshot archives
        if: steps.check.outputs.is_snapshot == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          CURRENT="qpm-${{ steps.check.outputs.version }}.tar.gz"

          EXISTING=$(gh release view snapshot --json assets -q '.assets[].name' 2>/dev/null || true)
          STALE=$(grep -E '^qpm-.*\.tar\.gz$' <<< "${EXISTING:-}" | grep -vFx "$CURRENT" || true)

          if [[ -z "$STALE" ]]; then
            echo "No superseded snapshot archives to prune."
            exit 0
          fi

          while read -r name; do
            [[ -n "$name" ]] || continue
            echo "Deleting superseded snapshot archive: $name"
            gh release delete-asset snapshot "$name" --yes
          done <<< "$STALE"

      - name: Create snapshot release
        if: steps.check.outputs.is_snapshot == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot
          name: ${{ steps.check.outputs.version }}
          prerelease: true
          body_path: RELEASE_NOTES.md
          files: |
            build/distributions/qpm-${{ steps.check.outputs.version }}.tar.gz
            build/libs/QPM.jar
            build/reports/cyclonedx-direct/bom.json
            build/component-manifest.json

  # Runs only on a `vX.Y.Z` tag push - either created automatically by
  # `tag-release` above, or (recovery path) pushed directly by a maintainer.
  build-and-publish:
    runs-on: ubuntu-latest
    if: github.repository == 'Qilletni/QPMCLI' && startsWith(github.ref, 'refs/tags/')
    environment: production-release
    permissions:
      contents: write
    outputs:
      version: ${{ steps.check.outputs.version }}
      commit: ${{ github.sha }}
      asset_name: ${{ steps.archive.outputs.asset_name }}
      asset_sha256: ${{ steps.archive.outputs.sha256 }}
      api_version: ${{ steps.check.outputs.api_version }}
      pkgutil_version: ${{ steps.check.outputs.pkgutil_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v5

      - uses: actions/checkout@v7
        with:
          repository: Qilletni/Qilletni
          path: .qilletni-release-tooling
          sparse-checkout: tools/release
          submodules: true  # tools/release submodule (Qilletni/ReleaseTooling)

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: .qilletni-release-tooling/tools/release/package-lock.json

      - name: Install release tooling dependencies
        working-directory: .qilletni-release-tooling/tools/release
        run: npm ci

      - name: Validate release configuration
        working-directory: .qilletni-release-tooling/tools/release
        run: |
          node --import tsx src/cli.ts validate-release-config --config "$GITHUB_WORKSPACE/.qilletni/release.yml"

      - name: Check the tag matches qpmVersion, and read the embedded upstream versions
        id: check
        working-directory: .qilletni-release-tooling/tools/release
        run: |
          VERSION=$(node --import tsx src/cli.ts get-property --file "$GITHUB_WORKSPACE/gradle.properties" --key qpmVersion)
          API_VERSION=$(node --import tsx src/cli.ts get-property --file "$GITHUB_WORKSPACE/gradle.properties" --key qilletniCoreVersion)
          PKGUTIL_VERSION=$(node --import tsx src/cli.ts get-property --file "$GITHUB_WORKSPACE/gradle.properties" --key qilletniPkgutilVersion)

          TAG=${GITHUB_REF#refs/tags/}
          TAG_VERSION=${TAG#v}

          if [[ "$VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::Tag version $TAG_VERSION does not match qpmVersion $VERSION"
            exit 1
          fi

          if [[ "$VERSION" =~ -SNAPSHOT$ ]]; then
            echo "::error::Cannot release a SNAPSHOT version on a tag."
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "api_version=$API_VERSION"
            echo "pkgutil_version=$PKGUTIL_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Confirmed Release: $VERSION"

      - name: Ensure the resolved dependency graph has no SNAPSHOT/dynamic versions
        run: ./gradlew checkNoSnapshotDependencies -PincludeSiblingBuilds=false

      - name: Build the release archive (jar, launcher scripts, SBOM, component-manifest.json)
        run: ./gradlew releaseArchive -PincludeSiblingBuilds=false

      - name: Compute the release archive's sha256
        id: archive
        run: |
          ASSET="qpm-${{ steps.check.outputs.version }}.tar.gz"
          SHA256=$(sha256sum "build/distributions/$ASSET" | awk '{print $1}')
          echo "asset_name=$ASSET" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        uses: ffurrer2/extract-release-notes@v2
        with:
          changelog_file: CHANGELOG.md
          release_notes_file: RELEASE_NOTES.md
          prerelease: false

      - name: Create GitHub Release with the archive, SBOM and component-manifest.json
        run: |
          gh release create "${{ github.ref_name }}" --notes-file RELEASE_NOTES.md \
            "build/distributions/${{ steps.archive.outputs.asset_name }}" \
            "build/libs/QPM.jar" \
            "build/reports/cyclonedx-direct/bom.json#qpm-bom.json" \
            "build/component-manifest.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Notifies Qilletni/Qilletni of this stable release, via the exact
  # `qilletni-platform-component-release` event schema (see
  # `src/release_event.ts` in Qilletni/Qilletni), so it can stage this
  # release as a platform candidate. The GitHub App token is scoped to only
  # Qilletni/Qilletni - never a broad, org-wide token.
  dispatch-platform:
    needs: build-and-publish
    runs-on: ubuntu-latest
    if: github.repository == 'Qilletni/QPMCLI'
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Qilletni/Qilletni
          path: .qilletni-release-tooling
          sparse-checkout: tools/release
          submodules: true  # tools/release submodule (Qilletni/ReleaseTooling)

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: .qilletni-release-tooling/tools/release/package-lock.json

      - name: Install release tooling dependencies
        working-directory: .qilletni-release-tooling/tools/release
        run: npm ci

      - name: Build the platform-component-release event
        id: event
        working-directory: .qilletni-release-tooling/tools/release
        run: |
          EVENT=$(node --import tsx src/cli.ts build-release-event \
            --component qpm \
            --repository Qilletni/QPMCLI \
            --version "${{ needs.build-and-publish.outputs.version }}" \
            --commit "${{ needs.build-and-publish.outputs.commit }}" \
            --asset "${{ needs.build-and-publish.outputs.asset_name }}" \
            --sha256 "${{ needs.build-and-publish.outputs.asset_sha256 }}" \
            --embed "api=${{ needs.build-and-publish.outputs.api_version }}" \
            --embed "pkgutil=${{ needs.build-and-publish.outputs.pkgutil_version }}")
          {
            echo 'json<<EVENT_EOF'
            echo "$EVENT"
            echo 'EVENT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Mint a GitHub App token scoped only to Qilletni/Qilletni
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.QILLETNI_RELEASE_APP_ID }}
          private-key: ${{ secrets.QILLETNI_RELEASE_APP_PRIVATE_KEY }}
          owner: Qilletni
          repositories: Qilletni

      - name: Dispatch the platform-component-release event to Qilletni/Qilletni
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: Qilletni/Qilletni
          event-type: qilletni-platform-component-release
          client-payload: ${{ steps.event.outputs.json }}

  snapshot-followup:
    needs: [build-and-publish, dispatch-platform]
    uses: Qilletni/Qilletni/.github/workflows/reusable-snapshot-followup.yml@master
    with:
      version_file: gradle.properties
      version_key: qpmVersion
      released_version: ${{ needs.build-and-publish.outputs.version }}
    secrets:
      app-id: ${{ secrets.QILLETNI_RELEASE_APP_ID }}
      app-private-key: ${{ secrets.QILLETNI_RELEASE_APP_PRIVATE_KEY }}
